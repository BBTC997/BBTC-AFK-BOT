name: Run Minecraft Bot 24/7
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *' # Restarts every 6 hours automatically to stay fresh

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Dependencies
      run: npm install mineflayer

    - name: Run Bot
      run: node index.js
